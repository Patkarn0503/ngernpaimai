<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เงินไปไหน</title>
<meta name="theme-color" content="#ecebe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เงินไปไหน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Taviraj:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js" defer></script>
<style>
/* ===== สี/ธีม: ปฏิทินฉีก แผ่นขาวบนพื้นเทา หมึกดำ แดงปฏิทิน ===== */
:root{
 --bg:#ecebe7;--surface:#fff;--surface2:#e2e0da;--text:#141414;--muted:#64625c;--border:#d6d3cb;--grid:#e7e4dd;
 --accent:#d7261e;--accent-ink:#fff;--ink:#141414;--ink-on:#fff;--pos:#1d7a52;--warn:#9a5a00;--danger:#b3261e;
 --s1:#3a3833;--s2:#d7261e;--s3:#9a968c;
 --q0:#e9e7e1;--q1:#fbdcd8;--q2:#f6b2aa;--q3:#ee8277;--q4:#e0473b;--q5:#c1281f;--q6:#8e1912;
 --shadow:0 10px 22px -14px rgba(40,30,20,.35);--heat-ink:#fff;
 --d0:#d7261e;--d1:#e3b400;--d2:#e2639f;--d3:#2e9e4f;--d4:#ec8420;--d5:#3b82d6;--d6:#7b4fc0;
 --fd:"Taviraj",Georgia,serif;--fb:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
 --r:8px;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#121211;--surface:#1f1e1c;--surface2:#2b2a27;--text:#f1efea;--muted:#a9a69d;--border:#36342f;--grid:#2c2b28;
 --accent:#ff5b4f;--accent-ink:#1a0806;--ink:#f1efea;--ink-on:#121211;--pos:#4cc38a;--warn:#e6a23c;--danger:#ff7a70;
 --s1:#d9d6ce;--s2:#e8483d;--s3:#7a776f;
 --q0:#2a2926;--q1:#4a1d1a;--q2:#6e2420;--q3:#9c2e26;--q4:#d23a2e;--q5:#ff6a5c;--q6:#ffb0a6;
 --shadow:0 10px 22px -14px rgba(0,0,0,.7);--heat-ink:#1a0806;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121211;--surface:#1f1e1c;--surface2:#2b2a27;--text:#f1efea;--muted:#a9a69d;--border:#36342f;--grid:#2c2b28;
 --accent:#ff5b4f;--accent-ink:#1a0806;--ink:#f1efea;--ink-on:#121211;--pos:#4cc38a;--warn:#e6a23c;--danger:#ff7a70;
 --s1:#d9d6ce;--s2:#e8483d;--s3:#7a776f;
 --q0:#2a2926;--q1:#4a1d1a;--q2:#6e2420;--q3:#9c2e26;--q4:#d23a2e;--q5:#ff6a5c;--q6:#ffb0a6;
 --shadow:0 10px 22px -14px rgba(0,0,0,.7);--heat-ink:#1a0806;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--fb);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg)}
header.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;min-height:48px}
header.top h1{font:900 22px/1.2 var(--fd);margin:0;flex:1;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:8px;background:var(--surface2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--pos)}.sync.pending i{background:var(--warn)}.sync.err i{background:var(--danger)}
.sync.busy i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:0 16px 24px;display:none;-webkit-overflow-scrolling:touch}
.view.active{display:block}
nav.bottom{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted)}
nav.bottom button.on{color:var(--accent)}
nav.bottom svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== ส่วนประกอบทั่วไป ===== */
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--ink-on);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:13px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip.set{border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{padding:10px 16px;border-radius:10px;background:var(--surface2);font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
input.f,select.f,textarea.f{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:16px}
textarea.f{resize:vertical;min-height:64px}
select.mini{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;max-width:150px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 3px;font-variant-numeric:tabular-nums;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
table.t th{color:var(--muted);font-weight:500;font-size:12px}
table.t th:first-child,table.t td:first-child{text-align:left}
.tscroll{overflow-x:auto;margin:0 -4px}
.pos{color:var(--pos)}

/* ===== หน้าบันทึก ===== */
#v-add{padding:0;flex-direction:column;overflow:hidden}
#v-add.active{display:flex}
.add-top{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.amount{text-align:right;padding:2px 4px}
.amount .expr{font-size:13px;color:var(--muted)}
.amount .expr:empty{display:none}
.add-top>*{flex:none}
.amount .val{font-size:40px;font-weight:600;line-height:1.1}
.amount .val small{font-size:20px;color:var(--muted);font-weight:500}
.catgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 16px;align-content:start}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:8px;background:var(--surface);border:1.5px solid var(--border);font-size:12px;line-height:1.2;text-align:center;min-height:64px}
.cat .e{font-size:26px;line-height:1}
.cat span:last-child{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.cat.add{color:var(--muted);border:1.5px dashed var(--border);background:none}
.catgrid.quick{display:flex;flex:none;gap:6px;overflow-x:auto;overflow-y:hidden;padding:4px 16px 8px;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none;overscroll-behavior-x:contain;margin-top:6px}
.catgrid.quick::-webkit-scrollbar{display:none}
.catgrid.quick .cat{flex:0 0 calc((100% - 18px)/4.4);scroll-snap-align:start}
.catgrid.quick .cat{min-height:78px;font-size:13px;justify-content:center}
.catgrid.quick .cat .e{font-size:26px}
.catgrid.quick .cat span:last-child{-webkit-line-clamp:1}
.catgrid.full{grid-template-columns:repeat(3,1fr);gap:8px}
.catgrid.full .cat{min-height:92px;font-size:14px;gap:6px;justify-content:center}
.catgrid.full .cat .e{font-size:32px}
.ghead{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);padding:2px 0 4px}
.ghead button{padding:8px 14px;border-radius:8px;background:var(--surface2);color:var(--text);font-weight:500}
.pad{flex:1;min-height:0;grid-template-rows:repeat(5,minmax(34px,68px));align-content:end;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 16px 10px;background:var(--bg);border-top:1px solid var(--border)}
.pad button{height:auto;min-height:0;border-radius:8px;background:var(--surface);font-size:22px;font-weight:500;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button.op{color:var(--accent);background:var(--surface2)}
.pad button:active{filter:brightness(.92)}
.pad .save{grid-column:span 3;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:600}
.pad .save:disabled{opacity:.4}

@media (max-height:700px){
 header.top{min-height:40px;padding-bottom:4px}
 .add-top{gap:6px}
 .pad{gap:5px;padding-top:6px;padding-bottom:6px}.pad button{font-size:20px}
 .seg button{padding:5px 4px}.chip{padding:5px 10px}
 .catgrid.quick .cat{min-height:64px;padding:5px 2px}.catgrid.quick .cat .e{font-size:22px}
}
@media (max-height:600px){.pad button{font-size:18px}}

/* ===== แผ่นปฏิทินวันนี้ (จุดเด่น) ===== */
.dsheet{position:relative;background:var(--surface);border-radius:4px 4px 10px 10px;padding:22px 14px 0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:end;box-shadow:0 1px 0 var(--border),0 4px 0 -2px var(--surface),0 5px 0 -2px var(--border),0 8px 0 -4px var(--surface),0 9px 0 -4px var(--border),var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dsheet::after{content:"";position:absolute;top:6px;left:50%;width:60px;margin-left:-30px;height:7px;background:radial-gradient(circle,var(--bg) 2.6px,transparent 3.2px) 0 0/15px 7px repeat-x}
.dnum{font:900 64px/.86 var(--fd);color:var(--text);grid-row:span 2;letter-spacing:-.03em;padding-bottom:4px}
.dsheet.today .dnum{color:var(--accent)}
.dinfo{display:flex;flex-direction:column;font-size:12px;color:var(--muted);line-height:1.35}
.dinfo b{font-size:14px;color:var(--text);font-weight:600}
.dinfo b::before,.dtab i::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dc);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 1px color-mix(in srgb,var(--text) 12%,transparent)}
.dtab i::before{width:6px;height:6px;margin-right:3px}
.damt{text-align:right;min-width:0}
.damt .expr{font-size:12px;color:var(--muted);font-family:var(--fb)}
.damt .expr:empty{display:none}
.damt .v{font:900 40px/1.05 var(--fd);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.damt .v small{font:500 18px var(--fb);color:var(--muted);margin-left:4px}
.dfoot{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:10px;border-top:1px dashed var(--border);padding:4px 0 6px;font-size:12px;color:var(--muted)}
.dfoot span{flex:1;text-align:center}
.dfoot b{color:var(--text);font-weight:600}
.dfoot button{width:36px;height:30px;border-radius:8px;color:var(--text);font-size:18px}
.dfoot button:disabled{opacity:.25}
.dsheet.flip{animation:flip .22s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:translateY(-6px) rotate(-.6deg);opacity:.6}}
.tick{animation:tick .35s cubic-bezier(.2,.8,.2,1)}
@keyframes tick{from{color:var(--accent);transform:translateY(-3px)}}
@media (max-height:700px){.dsheet{padding-top:14px}.dnum{font-size:52px}.damt .v{font-size:32px}.dfoot{margin-top:6px}}
@media (max-height:640px){.dsheet{padding-top:12px}.dnum{font-size:40px}.damt .v{font-size:26px}.dinfo b{font-size:13px}.dfoot{margin-top:4px;padding:0 0 2px}.dfoot button{height:24px}.catgrid.quick .cat{min-height:54px;padding:4px 2px}.catgrid.quick .cat .e{font-size:20px}.add-top{gap:5px}.pad{padding-top:5px;padding-bottom:5px}}
@media (max-height:600px){header.top{min-height:36px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:2px}.dsheet{padding-top:10px}.dnum{font-size:32px}.damt .v{font-size:22px}#dMon{display:none}.dsheet::after{display:none}.dfoot{margin-top:2px}.seg button{padding:4px}.pad{gap:4px;grid-template-rows:repeat(5,minmax(26px,1fr))}.pad button{font-size:18px}.catgrid.quick{padding-bottom:4px}.catgrid.quick .cat{min-height:48px}}
@media (prefers-reduced-motion:reduce){.dsheet.flip,.tick{animation:none}}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
input,textarea{caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}

/* ===== แผ่นสรุปเดือน (หน้าสถิติ) ===== */
.msheet{position:relative;margin-top:12px;background:var(--surface);border-radius:4px 4px 8px 8px;padding:20px 14px 0;box-shadow:0 1px 0 var(--border),0 4px 0 -2px var(--surface),0 5px 0 -2px var(--border),var(--shadow)}
.msheet::after{content:"";position:absolute;top:6px;left:50%;width:60px;margin-left:-30px;height:7px;background:radial-gradient(circle,var(--bg) 2.6px,transparent 3.2px) 0 0/15px 7px repeat-x}
.mhead{font:900 22px/1.2 var(--fd);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mhead span{flex:1;min-width:0}
.mhead button{width:34px;height:32px;border-radius:8px;background:var(--surface2);font:500 18px var(--fb);flex:none}
.mhead button{order:2}.mhead button:disabled{opacity:.3}
table.t td small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.mbig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:10px;border-bottom:1px solid var(--grid)}
.mbig small{display:block;font-size:12px;color:var(--muted)}
.mbig b{display:block;font:900 22px/1.15 var(--fd);letter-spacing:-.01em;white-space:nowrap}
.mbig i,.lrow i,.mfoot i{font-style:normal;font-size:12px;color:var(--muted)}
.red{color:var(--accent)}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
.lrow span:first-child{color:var(--muted)}
.lrow span:last-child{font-weight:600}
.lrow i{font-weight:400;margin-left:4px}
.mfoot{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline;border-top:1px dashed var(--border);margin-top:-1px;padding:8px 0 10px}
.mfoot span{font-size:13px;color:var(--muted)}
.mfoot b{font:900 20px var(--fd);text-align:right}
.mfoot i{grid-column:1/-1;text-align:right}
.ico{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.mcal .g span.today{box-shadow:inset 0 0 0 2px var(--text)}
.mcal .g span.fut{background:none;box-shadow:inset 0 0 0 1px var(--grid);color:var(--muted);opacity:.7}

/* ===== หน้ารายการ ===== */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.mnav button{width:40px;height:36px;border-radius:8px;background:var(--surface2);font-size:18px}
.mnav b{font-size:16px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sumrow div{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.sumrow small{display:block;color:var(--muted);font-size:12px}
.sumrow b{font-size:16px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.dayh{display:flex;align-items:flex-end;gap:10px;font-size:13px;color:var(--muted);margin:16px 2px 6px}
.dtab{display:flex;flex-direction:column;align-items:center;min-width:40px;padding:4px 6px 3px;background:var(--surface);border:1px solid var(--border);border-radius:4px 4px 6px 6px;line-height:1}
.dtab b{font:900 20px/1 var(--fd);color:var(--text)}
.dtab b.sun{color:var(--accent)}
.dtab i{font-style:normal;font-size:10px;color:var(--muted);margin-top:2px}
.tx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;background:var(--surface);border-bottom:1px solid var(--grid)}
.txs{border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.txs .tx:last-child{border-bottom:0}
.tx .ic{font-size:22px;width:32px;text-align:center}
.tx .mid b{display:block;font-weight:500;font-size:14px}
.tx .mid small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:600;white-space:nowrap}
.tx .amt.tr{color:var(--muted)}

/* ===== หน้าสถิติ ===== */
.ch{width:100%}
.bud{margin:10px 0}
.bud .row{font-size:13px}
.track{position:relative;height:8px;border-radius:4px;background:var(--surface2);margin-top:5px;overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.track .fill.warn{background:var(--warn)}.track .fill.over{background:var(--danger)}
.track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.warn{color:var(--warn)}.tag.over{color:var(--danger)}
.calwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.calwrap .mcal{max-width:340px}
.mcal b{display:block;font:700 14px/1.3 var(--fd);margin-bottom:4px}
.mcal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mcal .g span{aspect-ratio:1;border-radius:4px;background:var(--q0);font:900 11px/1 var(--fd);color:var(--muted);display:flex;align-items:center;justify-content:center}
.mcal .g span.l4,.mcal .g span.l5,.mcal .g span.l6{color:var(--heat-ink)}
.mcal .g span.sun{color:var(--accent)}
.mcal .g span.sun.l4,.mcal .g span.sun.l5,.mcal .g span.sun.l6{color:var(--heat-ink)}
.mcal .g span.h{background:none;font-size:10px;color:var(--muted);aspect-ratio:auto;padding-bottom:2px}
.mcal .g span.h.sun{color:var(--accent)}
.mcal .g span.x{background:none}
.l1{background:var(--q1)!important}.l2{background:var(--q2)!important}.l3{background:var(--q3)!important}.l4{background:var(--q4)!important}.l5{background:var(--q5)!important}.l6{background:var(--q6)!important}
.legend-q{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin-top:8px}
.legend-q span{width:12px;height:12px;border-radius:4px}
.anom{padding:8px 0;border-bottom:1px solid var(--grid);font-size:13px}
.anom:last-child{border:0}

/* ===== หน้าตั้งค่า ===== */
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-top:12px;overflow:hidden}
details.sec>summary{list-style:none;padding:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:1.8px solid var(--muted);border-bottom:1.8px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
details.sec[open]>summary::after{transform:rotate(45deg)}
.sec-body{padding:0 14px 14px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--grid)}
.item .e{font-size:20px;width:28px;text-align:center}
.item .grow b{font-weight:500;display:block}
.item .grow small{color:var(--muted);font-size:12px}
.item.arch{opacity:.5}
.mv{width:30px;height:30px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--grid)}
.tog:first-child{border-top:0}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:14px;background:var(--surface2);border:1px solid var(--border);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:.2s}
.sw input:checked+span{background:var(--accent);border-color:var(--accent)}
.sw input:checked+span::after{left:20px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ===== Sheet / Toast ===== */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:relative;background:var(--bg);border-radius:10px 10px 0 0;max-height:88dvh;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet-head{display:flex;align-items:center;padding:14px 16px 8px}
.sheet-head b{flex:1;font-size:16px}
.sheet-head button{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--muted)}
.sheet-body{overflow-y:auto;padding:4px 16px 12px}
.sheet-foot{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.sheet-foot:empty{display:none}
.sheet-foot .btn{flex:1}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.emojis button{font-size:20px;padding:4px 0;border-radius:8px;background:var(--surface)}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;background:var(--surface);border:1.5px solid transparent;text-align:left}
.pick button.on{border-color:var(--accent)}
.slipbar{font-size:13px;color:var(--muted);margin:0 0 8px}
.slip{display:flex;gap:10px;padding:10px;border-radius:8px;background:var(--surface);border:1.5px solid var(--border);margin-bottom:10px}
.slip.off{opacity:.55}
.slip img{width:64px;height:88px;object-fit:cover;object-position:top;border-radius:8px;flex:none;background:var(--surface2)}
.slip .grow{display:flex;flex-direction:column;gap:6px}
.slip .r{display:flex;gap:6px;align-items:center}
.slip input.f,.slip select.f{padding:7px 9px;font-size:15px;border-radius:8px}
.slip .amt{font-weight:600;max-width:120px}
.slip .badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.slip .badge.warn{color:var(--warn)}.slip .badge.err{color:var(--danger)}
.slip .ck{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.slip .r select.f{flex:1;min-width:0;white-space:nowrap;text-overflow:ellipsis}
.slip select.cat:invalid{border-color:var(--warn);color:var(--warn)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
#toast[hidden]{display:none}
#toast button{color:var(--q2);font-weight:600;white-space:nowrap;flex:none}
</style>

<script>
'use strict';
// ===== ค่าคงที่ / ตัวช่วย =====
const VER='1.0.0';
const TABLES=['transactions','categories','accounts','templates','recurring'];
const NUMK=new Set(['amount','budget','opening_balance','sort_order','every','is_fixed','archived','active','updated_at','deleted']);
const DEF={autoSave:true,sortUsage:true,be:true,theme:'auto',defAcc:'a_cash',autoSync:true,syncUrl:'',syncToken:'',cursor:0,lastSync:0,seeded:false,deviceId:''};
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TMF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TDF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const DOW_MON=['จ','อ','พ','พฤ','ศ','ส','อา'];
const EMOJIS='🍜🍚🍔🍕☕🧋🍺🛒🛍️🧴🏠💡💧📱🌐🚌🚕🚇⛽🚗✈️🏨🎬🎮🎵📚🎓💊🏥🏋️🐶👶🎁🙏💼💰📈🏦💵💳🧾📦🔧👕💇🧸🎨🍰🥗'.match(/\p{Extended_Pictographic}️?/gu);
const ICO={
 clock:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 pen:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
 slip:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
 down:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>',
 cal:'<svg class="ico" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
 alert:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
 up:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/></svg>',
 rep:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/></svg>'
};
const TYPE_LB={expense:'รายจ่าย',income:'รายรับ',transfer:'โอน'};
const FREQ_LB={daily:'วัน',weekly:'สัปดาห์',monthly:'เดือน',yearly:'ปี'};

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const nowTs=()=>{const d=new Date();return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const ym=s=>s.slice(0,7);
const addMonths=(s,n)=>{let[y,m]=s.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`};
const dim=s=>{const[y,m]=s.split('-').map(Number);return new Date(y,m,0).getDate()};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const yy=y=>String(M.be?y+543:y).slice(-2);
const lbM=s=>{const[y,m]=s.split('-').map(Number);return `${TM[m-1]} ${yy(y)}`};
const lbMF=s=>{const[y,m]=s.split('-').map(Number);return `${TMF[m-1]} ${M.be?y+543:y}`};
const lbD=s=>{const d=pd(s);return `${TD[d.getDay()]} ${d.getDate()} ${TM[d.getMonth()]}`};
const lbDY=s=>`${lbD(s)} ${yy(pd(s).getFullYear())}`;
const NF=new Intl.NumberFormat('th-TH',{maximumFractionDigits:2});
const fmt=n=>NF.format(Math.round((+n||0)*100)/100);
const kfmt=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?(n/1e3).toFixed(a>=1e4?0:1)+'K':String(Math.round(n))};
const pct=(a,b)=>b?a/b*100:null;
const dpct=(cur,prev)=>{if(!prev)return '';const d=(cur-prev)/prev*100;return `${d>=0?'+':'−'}${Math.abs(d).toFixed(0)}%`};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const normTags=s=>String(s||'').split(/[,#\s]+/).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(',');
const showTags=s=>s?s.split(',').map(x=>'#'+x).join(' '):'';
const isDemo=r=>String(r.id).startsWith('demo_');
const sum=a=>a.reduce((s,x)=>s+x,0);

// ===== IndexedDB =====
let DB=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('ngernpaimai',1);r.onupgradeneeded=()=>{const d=r.result;TABLES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const idb={
 all:s=>DB?new Promise((res,rej)=>{const r=DB.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}):Promise.resolve([]),
 put:(s,arr)=>DB&&arr.length?new Promise((res,rej)=>{const t=DB.transaction(s,'readwrite'),o=t.objectStore(s);arr.forEach(v=>o.put(v));t.oncomplete=res;t.onerror=()=>rej(t.error)}):Promise.resolve(),
 del:(s,ids)=>DB&&ids.length?new Promise((res,rej)=>{const t=DB.transaction(s,'readwrite'),o=t.objectStore(s);ids.forEach(i=>o.delete(i));t.oncomplete=res;t.onerror=()=>rej(t.error)}):Promise.resolve(),
 clear:s=>DB?new Promise((res,rej)=>{const t=DB.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=res;t.onerror=()=>rej(t.error)}):Promise.resolve()
};

// ===== สถานะข้อมูล =====
let M={...DEF};
const S={},IDX={};TABLES.forEach(t=>{S[t]=[];IDX[t]={}});
const saveMeta=()=>idb.put('meta',Object.entries(M).map(([k,v])=>({k,v})));
function setRec(t,r){const old=IDX[t][r.id];if(old){S[t][S[t].indexOf(old)]=r}else S[t].push(r);IDX[t][r.id]=r}
const live=t=>S[t].filter(r=>!r.deleted);
const get=(t,id)=>{const r=IDX[t][id];return r&&!r.deleted?r:null};
const bySort=(a,b)=>(a.sort_order||0)-(b.sort_order||0);
async function save(t,rec,o={}){
 const old=IDX[t][rec.id]||{};
 const r={...old,...rec,updated_at:Math.max(Date.now(),(old.updated_at||0)+1),deleted:rec.deleted?1:0,dirty:1};
 setRec(t,r);await idb.put(t,[r]);
 if(!o.silent){scheduleSync();refresh()}
 return r;
}
const remove=(t,id,o)=>IDX[t][id]?save(t,{...IDX[t][id],deleted:1},o):null;
function norm(t,r){const o={};for(const k in r){if(k==='synced_at'||k==='dirty')continue;const v=r[k];o[k]=NUMK.has(k)?(v===''||v==null?0:Number(v)||0):(v==null?'':String(v))}return o}
const catOf=id=>IDX.categories[id];
const accOf=id=>IDX.accounts[id];
const nextSort=t=>Math.max(0,...live(t).map(r=>+r.sort_order||0))+1;

// ===== ค่าเริ่มต้น =====
async function seed(){
 const base={budget:0,archived:0,updated_at:1,deleted:0,dirty:1};
 const ex=[['c_food','อาหาร','🍜'],['c_drink','กาแฟ/เครื่องดื่ม','☕'],['c_travel','เดินทาง','🚌'],['c_fuel','น้ำมัน/รถ','⛽'],['c_shop','ช้อปปิ้ง','🛍️'],['c_home','ของใช้','🧴'],['c_rent','ที่พัก','🏠',1],['c_util','ค่าน้ำไฟ','💡',1],['c_phone','โทรศัพท์/เน็ต','📱',1],['c_health','สุขภาพ','💊'],['c_fun','บันเทิง','🎬'],['c_edu','การศึกษา','📚'],['c_give','ทำบุญ/ให้','🙏'],['c_other','อื่นๆ','📦']];
 const inc=[['c_salary','เงินเดือน','💼'],['c_side','รายได้เสริม','💰'],['c_invest','ดอกเบี้ย/ปันผล','📈'],['c_inc_other','รายรับอื่น','🎁']];
 const cats=[...ex.map(([id,name,icon,f],i)=>({...base,id,name,icon,type:'expense',is_fixed:f||0,sort_order:i+1})),...inc.map(([id,name,icon],i)=>({...base,id,name,icon,type:'income',is_fixed:0,sort_order:i+1}))];
 const accs=[['a_cash','เงินสด','💵'],['a_bank','ธนาคาร','🏦'],['a_credit','บัตรเครดิต','💳']].map(([id,name,icon],i)=>({...base,id,name,icon,opening_balance:0,sort_order:i+1}));
 const tpls=[{id:'tp_coffee',name:'กาแฟ',type:'expense',amount:50,category_id:'c_drink',sort_order:1},{id:'tp_lunch',name:'ข้าวเที่ยง',type:'expense',amount:60,category_id:'c_food',sort_order:2}].map(x=>({...base,account_id:'',to_account_id:'',tags:'',note:'',...x}));
 for(const [t,arr] of [['categories',cats],['accounts',accs],['templates',tpls]]){arr.forEach(r=>{if(!IDX[t][r.id])setRec(t,r)});await idb.put(t,arr.filter(r=>IDX[t][r.id]===r))}
}

// ===== รายการประจำ =====
function nextOcc(r,d){
 const e=Math.max(1,+r.every||1),dt=pd(d);
 if(r.freq==='daily')return addDays(d,e);
 if(r.freq==='weekly')return addDays(d,7*e);
 const an=pd(r.start_date||d);
 let y=dt.getFullYear(),m=dt.getMonth();
 if(r.freq==='yearly'){y+=e;m=an.getMonth()}else{m+=e;y+=Math.floor(m/12);m%=12}
 return ymd(new Date(y,m,Math.min(an.getDate(),new Date(y,m+1,0).getDate())));
}
async function runRecurring(){
 const td=today();let n=0,ch=false;
 for(const r of live('recurring')){
  if(!+r.active||!r.next_date)continue;
  let nd=r.next_date,g=0,moved=false;
  while(nd<=td&&(!r.end_date||nd<=r.end_date)&&g++<2000){
   const id=`r_${r.id}_${nd}`;
   if(!IDX.transactions[id]){await save('transactions',{id,ts:`${nd} ${r.time||'08:00'}`,type:r.type,amount:+r.amount,category_id:r.type==='transfer'?'':r.category_id,account_id:r.account_id||M.defAcc,to_account_id:r.type==='transfer'?r.to_account_id:'',tags:r.tags||'',note:r.note||r.name,recurring_id:r.id},{silent:true});n++}
   nd=nextOcc(r,nd);moved=true;
  }
  if(moved){await save('recurring',{...r,next_date:nd},{silent:true});ch=true}
 }
 if(n)toast(`สร้างรายการประจำ ${n} รายการ`);
 if(ch){scheduleSync();refresh()}
 return n;
}

// ===== ซิงก์ Google Sheets =====
let syncing=false,syncTimer=null,syncErr='';
function pendingCount(){let n=0;TABLES.forEach(t=>S[t].forEach(r=>{if(r.dirty&&!isDemo(r))n++}));return n}
function scheduleSync(ms=2500){clearTimeout(syncTimer);if(M.syncUrl&&M.autoSync)syncTimer=setTimeout(()=>sync(),ms);renderSync()}
async function api(body){
 const res=await fetch(M.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:M.syncToken,...body})});
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();if(!j.ok)throw new Error(j.error||'ไม่ทราบสาเหตุ');return j;
}
async function sync(manual){
 if(!M.syncUrl){if(manual)toast('ยังไม่ได้ตั้งค่าซิงก์ — ไปที่ ตั้งค่า');return}
 if(syncing)return;
 if(!navigator.onLine){syncErr='ออฟไลน์';renderSync();return}
 syncing=true;syncErr='';renderSync();
 try{
  const changes={},sent={};
  TABLES.forEach(t=>{const a=S[t].filter(r=>r.dirty&&!isDemo(r));sent[t]=a.map(r=>[r.id,r.updated_at]);changes[t]=a.map(({dirty,...x})=>x)});
  const j=await api({action:'sync',cursor:M.cursor||0,changes,device:M.deviceId});
  for(const t of TABLES){
   const puts=[];

function evalExpr(s){
 const tk=s.replace(/[+−×÷]$/,'').match(/\d*\.?\d+|\d+\.|[+−×÷]/g)||[];
 let total=0,term=null,add='+',mul=null;
 for(const k of tk){
  if(k==='+'||k==='−'){if(term!==null)total=add==='+'?total+term:total-term;add=k;term=null}
  else if(k==='×'||k==='÷')mul=k;
  else{const n=parseFloat(k);term=term===null?n:mul==='×'?term*n:n?term/n:term;mul=null}
 }
 if(term!==null)total=add==='+'?total+term:total-term;
 return Math.round(total*100)/100;
}
function press(k){

 if(k==='C')e='';
 else if(k==='⌫')e=e.slice(0,-1);
 else if('+−×÷'.includes(k)){if(!e)return;if(/[+−×÷]$/.test(e))e=e.slice(0,-1);e+=k}
 else if(k==='.'){if(last.includes('.'))return;e+=last===''?'0.':'.'}

}

function calHeat(dmap,R){
 let m1=ym(R.toE),m0=ym(R.from);if(addMonths(m0,11)<m1)m0=addMonths(m1,-11);
 const vals=Object.entries(dmap).filter(([d,x])=>d>=m0+'-01'&&d<=R.toE&&x>0).map(([,x])=>x).sort((a,b)=>a-b);
 const th=[.2,.4,.6,.8,.95].map(p=>quantile(vals,p));
 const lv=x=>!x?0:1+th.filter(t=>x>t).length;
 let h='<div class="calwrap">';
 for(let m=m0;m<=m1;m=addMonths(m,1)){
  const off=(pd(m+'-01').getDay()+6)%7;
  h+=`<div class="mcal"><b>${lbM(m)}</b><div class="g">${DOW_MON.map((d,i)=>`<span class="h ${i===6?'sun':''}">${d}</span>`).join('')}${'<span class="x"></span>'.repeat(off)}`;
  for(let i=1;i<=dim(m);i++){const d=`${m}-${pad(i)}`,x=dmap[d]||0;h+=d>R.toE?`<span class="fut">${i}</span>`:`<span class="l${lv(x)} ${pd(d).getDay()?'':'sun'} ${d===today()?'today':''}" data-cd="${d}" data-v="${x}" title="${d}: ${fmt(x)}">${i}</span>`}
  h+='</div></div>';
 }
 h+=`</div><div class="legend-q">น้อย <span style="background:var(--q0)"></span><span class="l1"></span><span class="l2"></span><span class="l3"></span><span class="l4"></span><span class="l5"></span><span class="l6"></span> มาก</div>`;
 $('#calHeat').innerHTML=h;
}

 const rows=live('categories').filter(c=>c.type==='expense'&&+c.budget>0).sort(bySort).map(c=>{const spent=sp[c.id]||0,p=spent/c.budget*100;
  return {c,spent,p,st:p>100?['over','⚠ เกินงบ']:p>tp+10?['warn','▲ เร็วกว่าแผน']:null}});
 return {rows,tp};
}
function forecastMonth(){
 const td=today(),m=ym(td),D=dim(m),dd=+td.slice(8);
 let fixed=0,vr=0;
 live('transactions').forEach(t=>{if(t.type!=='expense'||ym(t.ts)!==m||!inAcc(t))return;const c=catOf(t.category_id);if(t.recurring_id||(c&&+c.is_fixed))fixed+= +t.amount;else vr+= +t.amount});
 let pending=0;const end=`${m}-${pad(D)}`;
 live('recurring').forEach(r=>{if(!+r.active||r.type!=='expense'||!r.next_date)return;let d=r.next_date,g=0;while(d<=end&&(!r.end_date||d<=r.end_date)&&g++<400){if(d>td)pending+= +r.amount;d=nextOcc(r,d)}});
 const rate=vr/dd;
 return {spent:fixed+vr,rate,left:D-dd,pending,total:fixed+vr+rate*(D-dd)+pending};
}
function anomalies(exp,R,bm){
 const out=[];
 const hist={};live('transactions').forEach(t=>{if(t.type==='expense'&&t.ts.slice(0,10)<=R.toE&&!t.recurring_id)(hist[t.category_id]=hist[t.category_id]||[]).push(+t.amount)});
 const st={};for(const k in hist){const s=hist[k].sort((a,b)=>a-b);if(s.length<8)continue;const med=quantile(s,.5),mad=quantile(s.map(x=>Math.abs(x-med)).sort((a,b)=>a-b),.5);st[k]={med,mad}}
 const items=exp.filter(t=>st[t.category_id]&&!t.recurring_id).map(t=>{const{med,mad}=st[t.category_id];const z=mad?0.6745*(t.amount-med)/mad:(t.amount>3*med?9:0);return {t,z,med}}).filter(x=>x.z>3.5).sort((a,b)=>b.z-a.z).slice(0,8);
 items.forEach(({t,z,med})=>{const c=catOf(t.category_id);out.push(`<div class="anom">${ICO.alert} <b class="num">${fmt(t.amount)}</b> · ${esc(c?c.icon+' '+c.name:'')} · ${lbD(t.ts)}<br><span class="muted small">สูงกว่าค่ากลางของหมวด (${fmt(med)}) ${(t.amount/med).toFixed(1)} เท่า · z = ${z.toFixed(1)}${t.note?' · '+esc(t.note):''}</span></div>`)});
 // เทียบหมวดรายเดือนกับ 6 เดือนก่อน
 const mm={};live('transactions').forEach(t=>{if(t.type==='expense'){const k=t.category_id,m=ym(t.ts);mm[k]=mm[k]||{};mm[k][m]=(mm[k][m]||0)+ +t.amount}});
 for(const k in mm){const cur=mm[k][bm]||0;if(!cur)continue;const prev=[1,2,3,4,5,6].map(i=>mm[k][addMonths(bm,-i)]||0);if(prev.filter(Boolean).length<3)continue;
  const mean=sum(prev)/6,sd=Math.sqrt(sum(prev.map(x=>(x-mean)**2))/5);if(!sd)continue;const z=(cur-mean)/sd;
  if(z>2){const c=catOf(k);out.push(`<div class="anom">${ICO.up} ${esc(c?c.icon+' '+c.name:'')} ${lbM(bm)} สูงกว่าปกติ <b>${z.toFixed(1)}σ</b><br><span class="muted small">${fmt(cur)} vs เฉลี่ย 6 เดือนก่อน ${fmt(mean)} (SD ${fmt(sd)})</span></div>`)}}
 return out.join('');
}

  if(rnd()<.15)P(d,19,'expense',ln(180,.6),'c_home','a_bank');
  if(we&&rnd()<.35)P(d,15+Math.floor(rnd()*5),'expense',ln(350,.6),'c_fun','a_credit',tg);
  if(rnd()<.03)P(d,10,'expense',ln(500,.8),'c_health','a_cash');
  if(rnd()<.05)P(d,8,'expense',ln(100,.9),'c_give','a_cash');
  if(inTrip&&i%4===0)P(d,9,'expense',3800,'c_travel','a_credit',{tags:'ทริปเชียงใหม่',note:'ตั๋วเครื่องบิน'});
  if(day===1)P(d,9,'expense',6500,'c_rent','a_bank',{note:'ค่าเช่าห้อง'});
  if(day===5)P(d,9,'expense',ln(1200,.15),'c_util','a_bank');

 }

// ===== ตัวแยกข้อมูลสลิป (ใช้ทั้งในแอปและทดสอบใน Node) =====
const SLIP_BANKS={'002':'กรุงเทพ','004':'กสิกรไทย','006':'กรุงไทย','011':'ทีทีบี','014':'ไทยพาณิชย์','025':'กรุงศรี','030':'ออมสิน','034':'ธ.ก.ส.','069':'เกียรตินาคินภัทร','022':'ซีไอเอ็มบี','024':'ยูโอบี','033':'ธอส.','066':'อิสลาม','067':'ทิสโก้','073':'แลนด์แอนด์เฮ้าส์'};
const SLIP_MON=['มค','กพ','มีค','เมย','พค','มิย','กค','สค','กย','ตค','พย','ธค'];
const SLIP_MON_EN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
// แยก TLV ของ QR สลิป → ธนาคาร + เลขอ้างอิง
function slipQR(s){
 if(!s)return null;
 const tlv=t=>{const o={};let i=0;while(i+4<=t.length){const id=t.slice(i,i+2),n=+t.slice(i+2,i+4);if(isNaN(n))break;o[id]=t.slice(i+4,i+4+n);i+=4+n}return o};
 const top=tlv(s),inner=top['00']?tlv(top['00']):{};
 if(inner['02'])return {bank:inner['01']||'',ref:inner['02']};
 return null;
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function slipMonth(raw){
 const k=raw.replace(/[\s.]/g,'').replace(/๓/g,'ต').replace(/๗/g,'ก').replace(/๑/g,'ค').toLowerCase();
 let i=SLIP_MON_EN.indexOf(k.slice(0,3));if(i>=0)return i+1;
 let best=0,bd=9;SLIP_MON.forEach((m,j)=>{const x=lev(k,m);if(x<bd){bd=x;best=j+1}});
 return bd<=1?best:0;
}
const slipNum=s=>parseFloat(String(s).replace(/[,\s]/g,'').replace(/[Oo]/g,'0'));
function parseSlip(text,qr){
 const t=text.normalize('NFC').replace(/ํา/g,'ำ').replace(/[|]/g,' ');
 const L=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
 const r={amount:null,fee:0,ts:'',payee:'',ref:'',bank:'',kind:'expense',source:''};
 // ยอดเงิน: ให้ "ที่ชำระ" ก่อน แล้วค่อย "จำนวนเงิน"
 const am=t.match(/จ[ำา]?นวนเงินที่ช[ำา]ระ\s*([\d,]+(?:\.\d{1,2})?)/)||t.match(/จ[ำา]?นวน(?:เงิน)?\s*([\d,]+(?:[.]\d{1,2})?)\s*(?:บาท|THB|฿)/i)||t.match(/(?:amount|ยอดเงิน|ยอดชำระ)\s*:?\s*([\d,]+(?:\.\d{1,2})?)/i);
 if(am)r.amount=slipNum(am[1]);
 else{const all=[...t.matchAll(/^(?!.*ธรรมเนียม).*?([\d,]+\.\d{2})\s*(?:บาท|THB)/gm)].map(m=>slipNum(m[1]));if(all.length)r.amount=Math.max(...all)}
 const fe=t.match(/ค่าธรรมเนียม\s*([\d,]+(?:\.\d{1,2})?)/);if(fe)r.fee=slipNum(fe[1])||0;
 // วันเวลา: 22 ต.ค. 2569 - 08:28 / 22 ต.ค. 69, 08:28 น. / 22 Oct 2026 08:28
 const dm=t.match(/(\d{1,2})\s+([ก-๙a-z]{1,3}\.?\s?[ก-๙a-z]?\.?)\s*(\d{4}|\d{2})\s*[-,]?\s*(\d{1,2})[:.](\d{2})/i);
 if(dm){const mo=slipMonth(dm[2]);let y=+dm[3];if(y<100)y+=y>=40?2500:2000;if(y>2400)y-=543;
  if(mo&&+dm[1]>=1&&+dm[1]<=31)r.ts=`${y}-${String(mo).padStart(2,'0')}-${String(+dm[1]).padStart(2,'0')} ${String(+dm[4]).padStart(2,'0')}:${dm[5]}`}
 // ผู้รับ
 const clean=s=>s.replace(/^[^ก-๙A-Za-z0-9(]+/,'').replace(/^(?:\S{1,2}\s{2,})+/,'').replace(/\s{2,}.*$/,'').trim();
 const skip=/^(พร้อมเพย์|PromptPay|XXX|xxx|x{3}|\(?\d[\d\s-]{6,}\)?$|รหัส|หมายเลข|เลขที่|จำนวน|ค่าธรรมเนียม|วันที่|ธนาคาร|กรุงไทย$|กสิกร|ไทยพาณิชย์)/;
 let i=L.findIndex(x=>/ไปยัง|^ถึง\b|^To\b/i.test(x));
 if(i>=0){
  const same=clean(L[i].split(/ไปยัง|ถึง|To/i).pop()||'');let p=same.length>2?same:'';let j=i+1;
  while(!p&&j<L.length&&j<i+3){const c=clean(L[j]);if(c.length>1&&!skip.test(c))p=c;j++}
  if(p&&(p.match(/\(/g)||[]).length>(p.match(/\)/g)||[]).length&&L[j])p+=' '+clean(L[j]);
  r.payee=p;
 }else{
  const k=L.findIndex(x=>/Wallet ID|เลขที่บัญชี|บัญชี/i.test(x));
  if(k>=0){for(let j=k+1;j<Math.min(L.length,k+3);j++){const c=clean(L[j]);if(c.length>1&&!skip.test(c)){r.payee=c;break}}}
 }
 r.payee=r.payee.replace(/\s*\(\d{8,}\)$/,'').slice(0,80);
 // อ้างอิง + แหล่งที่มา
 const q=slipQR(qr);
 if(q){r.ref=q.ref;r.bank=q.bank;r.source=q.bank}
 else{const rf=t.match(/(?:รหัสอ้างอิง|เลขที่รายการ|Ref(?:erence)?\.?(?:\s*No\.?)?)\s*:?\s*\(?([A-Za-z0-9]{8,})/i);if(rf)r.ref='ocr:'+rf[1]}
 if(!r.source)r.source=/G-?Wallet|เป๋าตัง|ไทยช่วยไทย/i.test(t)?'gwallet':/TrueMoney|ทรูมันนี่/i.test(t)?'truemoney':'other';
 if(/รับเงิน|เงินเข้า/.test(t)&&!/โอนเงิน|จ่าย/.test(t))r.kind='income';
 return r;
}

// ===== นำเข้าสลิป =====
const TESS=new URL('tess/',document.baseURI).href;
let tessP=null,tessLog=null;
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('โหลดไฟล์ไม่ได้: '+src.split('/').pop()));document.head.append(s)});
function ocrWorker(){
 if(!tessP)tessP=(async()=>{
  if(!window.Tesseract)await loadScript(TESS+'tesseract.min.js');
  if(!window.jsQR)await loadScript(TESS+'jsQR.js');
  // เตรียมไฟล์ภาษาไว้ในแคชของ Tesseract (IndexedDB) ครั้งเดียว
  const kv=await new Promise((res,rej)=>{const r=indexedDB.open('keyval-store');r.onupgradeneeded=()=>r.result.createObjectStore('keyval');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const kget=k=>new Promise(res=>{const q=kv.transaction('keyval').objectStore('keyval').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()});
  const kset=(k,v)=>new Promise((res,rej)=>{const t=kv.transaction('keyval','readwrite');t.objectStore('keyval').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});
  const codes=['tha','eng'];let done=0;
  for(const code of codes){
   if(await kget(`./${code}.traineddata`)){done++;continue}
   tessLog&&tessLog({status:'loading',progress:done/codes.length});
   const r=await fetch(TESS+code+'.traineddata.gz.wasm');if(!r.ok)throw new Error('โหลดข้อมูลภาษาไม่ได้');
   const raw=new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
   await kset(`./${code}.traineddata`,raw);done++;
  }
  kv.close();tessLog&&tessLog({status:'loading',progress:1});
  return Tesseract.createWorker(codes,1,{workerPath:TESS+'worker.min.js',corePath:TESS,langPath:TESS.slice(0,-1),workerBlobURL:false,cacheMethod:'readOnly',logger:m=>tessLog&&tessLog(m)});
 })().catch(e=>{tessP=null;throw e});
 return tessP;
}
async function slipImage(file){
 const bmp=await createImageBitmap(file),sc=Math.min(1,1200/bmp.width);
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
 const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
 let qr='';try{const q=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});qr=q?q.data:''}catch(e){}
 return {canvas:c,qr};
}
// เดาหมวดจากผู้รับที่เคยบันทึก
function guessCat(payee,type){let b=null;for(const t of S.transactions)if(!t.deleted&&t.type===type&&payee&&t.note===payee&&(!b||t.ts>b.ts))b=t;return b&&get('categories',b.category_id)?b.category_id:''}
function slipDup(it){const all=live('transactions');if(it.ref&&all.some(t=>t.ref===it.ref))return 'บันทึกแล้ว';if(it.amount&&it.ts&&all.some(t=>t.ts===it.ts&&+t.amount===+it.amount))return 'อาจซ้ำ';return ''}
async function importSlips(files){
 const items=files.map(f=>({file:f,url:URL.createObjectURL(f),st:'wait',sel:true,type:'expense',amount:'',ts:'',note:'',cat:'',acc:'',ref:'',fee:0,source:'',dup:''}));
 const box=el(`<div><div class="slipbar" id="slipBar">เตรียมตัวอ่านสลิป…</div><div id="slipList"></div></div>`),list=$('#slipList',box);
 const saveB=btn('บันทึก','pri',()=>commitSlips(items));
 const upd=()=>{const ok=items.filter(i=>i.sel&&i.st==='ok');saveB.textContent=`บันทึก ${ok.length} รายการ`;saveB.disabled=!ok.length||items.some(i=>i.st==='wait'||i.st==='ocr')};
 const card=it=>{
  const n=el(`<div class="slip ${it.sel?'':'off'}"><img alt=""><div class="grow"></div></div>`);$('img',n).src=it.url;const g=$('.grow',n);
  if(it.st!=='ok'){g.innerHTML=`<span class="badge ${it.st==='err'?'err':''}">${it.st==='wait'?'รอคิว':it.st==='ocr'?'กำลังอ่าน…':'อ่านไม่ได้: '+esc(it.err)}</span>`;if(it.st==='err')g.append(btn('ใส่เอง','',()=>{it.st='ok';it.ts=nowTs();it.sel=true;redraw(it)}));return n}
  const cats=live('categories').filter(c=>c.type===it.type&&!+c.archived).sort(bySort);
  g.innerHTML=`<div class="r"><input type="checkbox" class="ck" ${it.sel?'checked':''}><input class="f amt num" inputmode="decimal"><span class="grow"></span>${it.dup?`<span class="badge warn">${it.dup}</span>`:''}${it.fee?`<span class="badge">ค่าธรรมเนียม ${fmt(it.fee)}</span>`:''}</div>
   <input class="f ts" type="datetime-local"><input class="f pay" placeholder="ผู้รับ / ร้าน">
   <div class="r"><select class="f cat" required><option value="">— เลือกหมวด —</option>${cats.map(c=>`<option value="${c.id}">${esc(c.icon+' '+c.name)}</option>`).join('')}</select><select class="f acc">${accList().map(a=>`<option value="${a.id}">${esc(a.icon+' '+a.name)}</option>`).join('')}</select></div>`;
  const q=s=>$(s,g);q('.amt').value=it.amount;q('.ts').value=it.ts.replace(' ','T');q('.pay').value=it.note;q('.cat').value=it.cat;q('.acc').value=it.acc;
  q('.ck').onchange=e=>{it.sel=e.target.checked;n.classList.toggle('off',!it.sel);upd()};
  q('.amt').oninput=e=>it.amount=e.target.value.replace(/[^\d.]/g,'');q('.ts').onchange=e=>it.ts=e.target.value.replace('T',' ');
  q('.pay').oninput=e=>it.note=e.target.value;q('.cat').onchange=e=>it.cat=e.target.value;q('.acc').onchange=e=>it.acc=e.target.value;
  return n;
 };
 const nodes=items.map(card);nodes.forEach(n=>list.append(n));
 const redraw=it=>{const i=items.indexOf(it),n=card(it);nodes[i].replaceWith(n);nodes[i]=n;upd()};
 openSheet(`นำเข้าสลิป ${files.length} ใบ`,box,[saveB]);upd();
 const bar=$('#slipBar',box);
 tessLog=m=>{if(m.status&&/load|initializ/i.test(m.status))bar.textContent=`โหลดตัวอ่านภาษาไทย/อังกฤษ (ครั้งแรกประมาณ 4 MB) ${Math.round((m.progress||0)*100)}%`};
 let w;try{w=await ocrWorker()}catch(e){bar.textContent='เปิดตัวอ่านสลิปไม่ได้: '+e.message;items.forEach(it=>{it.st='err';it.err='ไม่มีตัวอ่าน';redraw(it)});return}
 for(const [i,it] of items.entries()){
  bar.textContent=`กำลังอ่าน ${i+1}/${items.length}`;it.st='ocr';redraw(it);
  try{
   const img=await slipImage(it.file),{data}=await w.recognize(img.canvas),r=parseSlip(data.text,img.qr);
   Object.assign(it,{type:r.kind,amount:r.amount?String(Math.round((r.amount+(r.fee||0))*100)/100):'',fee:r.fee,ts:r.ts||nowTs(),note:r.payee,ref:r.ref,source:r.source,st:'ok'});
   it.cat=guessCat(it.note,it.type);it.acc=get('accounts',(M.slipAcc||{})[it.source])?M.slipAcc[it.source]:A.account||M.defAcc;
   it.dup=slipDup(it);if(it.dup)it.sel=false;
   if(!r.amount){it.dup=(it.dup?it.dup+' · ':'')+'ไม่พบยอด'}
  }catch(e){it.st='err';it.err=e.message||String(e)}
  redraw(it);
 }
 const n=items.filter(i=>i.st==='ok').length;bar.textContent=`อ่านได้ ${n}/${items.length} ใบ · ตรวจหมวดและยอด แล้วกดบันทึก`;
}
async function commitSlips(items){
 const ok=items.filter(i=>i.sel&&i.st==='ok');
 for(const it of ok){if(!(+it.amount>0))return toast('มีรายการที่ยอดเงินว่าง');if(!get('categories',it.cat))return toast('มีรายการที่ยังไม่ได้เลือกหมวด');if(!it.ts)return toast('มีรายการที่ไม่มีวันเวลา')}
 M.slipAcc=M.slipAcc||{};
 for(const it of ok){await save('transactions',{id:uid('t'),type:it.type,amount:+it.amount,category_id:it.cat,account_id:it.acc,to_account_id:'',tags:'',note:it.note.trim(),ts:it.ts.slice(0,16),recurring_id:'',ref:it.ref},{silent:true});if(it.source)M.slipAcc[it.source]=it.acc}
 await saveMeta();items.forEach(i=>URL.revokeObjectURL(i.url));closeSheet();scheduleSync();refresh();toast(`บันทึกจากสลิป ${ok.length} รายการ`);
}
// รับสลิปที่แชร์มาจากแอปอื่น (Android)
async function takeShared(){
 if(!/[?&]shared=/.test(location.search)||!('caches' in window))return;
 history.replaceState(null,'',location.pathname);
 const c=await caches.open('ngernpaimai-share'),ks=await c.keys(),files=[];
 for(const k of ks){const b=await (await c.match(k)).blob();files.push(new File([b],'slip.jpg',{type:b.type||'image/jpeg'}));await c.delete(k)}
 if(files.length)importSlips(files);
}

// ===== เริ่มต้น =====
async function init(){
 try{DB=await idbOpen()}catch(e){DB=null}
 (await idb.all('meta')).forEach(r=>M[r.k]=r.v);
 if(!M.deviceId)M.deviceId=uid('d');
 for(const t of TABLES){S[t]=await idb.all(t);IDX[t]={};S[t].forEach(r=>IDX[t][r.id]=r)}
 if(!M.seeded){await seed();M.seeded=true}
 await saveMeta();applyTheme();
 bindAdd();
 $('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
 $('#syncBtn').onclick=()=>M.syncUrl?sync(true):go('settings');
 $('#slipFile').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importSlips(f)};
 $('#sheetX').onclick=closeSheet;$('.backdrop').onclick=closeSheet;
 let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>CH.forEach(c=>c.resize()),150)});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(VIEW==='stats')renderStats()});
 go('add');
 takeShared();
 if(!DB)toast('เบราว์เซอร์นี้บันทึกข้อมูลถาวรไม่ได้ (โหมดส่วนตัว?)');
 await runRecurring();
 if(M.syncUrl&&M.autoSync)sync();
 window.addEventListener('online',()=>{syncErr='';if(M.autoSync)sync()});
 window.addEventListener('offline',renderSync);
 document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){await runRecurring();if(M.syncUrl&&M.autoSync)sync()}});
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
